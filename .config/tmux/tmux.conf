# COLORS  
set -g default-terminal "screen-256color"
set-option -sa terminal-features "xterm-256color:RGB"
set-option -sa terminal-features "wezterm:RGB"
set -g allow-passthrough all

# OPTIONS
set -g mouse on
set -g set-clipboard on

set -sg escape-time 0
set-window-option -g mode-keys vi

# make windows and panes start at 1, not 0
set -g base-index 1
set -g pane-base-index 1

# ensure window index numbers get reordered on delete
set -g renumber-windows on

#STYLE
set-option -g status-position top
set-option -g status-style bg=default # make status bar transparent
set-option -g status-right "" # hide the right status
set -g status-left '#S'
set -g status-justify absolute-centre
setw -g window-status-current-style 'fg=colour4 bg=default bold'
setw -g window-status-current-format '#I:#W* '
setw -g window-status-style 'fg=color8'

# VIM-LIKE PANE SWITCHING (vim-tmux-navigator)
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# RESIZING PANES
bind -n M-h resize-pane -L 3
bind -n M-j resize-pane -D 3
bind -n M-k resize-pane -U 3
bind -n M-l resize-pane -R 3

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind r source-file "~/.config/tmux/tmux.conf"

bind-key f run-shell "tmux neww ~/.config/scripts/tmux-sessionizer.sh"
